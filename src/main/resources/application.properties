spring.application.name=toEvent
server.port=${PORT:8080}

spring.mongodb.uri=${MONGODB_URI}

auth.secret.token=${AUTH_TOKEN_SECRET}
auth.cookie.name=${AUTH_COOKIE_NAME:toEventAuth}
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
rate-limit.trust-forwarded-headers=${TRUST_PROXY_HEADERS:false}

spring.mongodb.database=${MONGODB_DATABASE}
spring.data.mongodb.auto-index-creation=true

# CORS: origens permitidas separadas por vírgula
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Swagger: desativado por padrão em produção; ative com SWAGGER_ENABLED=true em desenvolvimento
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}